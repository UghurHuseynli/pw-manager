http:
  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "same-origin"
        customResponseHeaders:
          Server: ""

    rate-limit:
      rateLimit:
        average: 50
        burst: 100
        period: "1m"
        sourceCriterion:
          ipStrategy:
            depth: 1

    compression:
      compress: {}
