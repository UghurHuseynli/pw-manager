# Static configuration file for Traefik
# Production-ready configuration for AWS deployment

# Global configuration
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# API and Dashboard
api:
  dashboard: true
  insecure: true  # Set to false in production
  debug: true

# Entry points
entryPoints:
  web:
    address: ":80"
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    #       permanent: true
  websecure:
    address: ":443"
    # http:
    #   tls:
    #     options: default
  traefik:
    address: ":8080"

# Certificate management
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       tlsChallenge: {}
#       email: your-email@example.com  # Replace with your email
#       storage: /data/traefik/acme.json
      # Use staging server for testing
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# Providers
providers:
  # File provider for static routes
  file:
    directory: /etc/traefik/dynamic
    watch: true
  docker:
    exposedByDefault: false
  
  # HTTP provider for service discovery (if using external service discovery)
  # http:
  #   endpoint: "http://service-discovery:8080/api/services"
  #   pollInterval: "5s"

# Logging
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log
  format: json

# Access logs
accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"

# Metrics (optional - for monitoring)
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

# Ping endpoint for health checks
ping:
  entryPoint: traefik

# Tracing (optional - for debugging)
# tracing:
#   jaeger:
#     samplingServerURL: http://jaeger:14268/api/sampling
#     localAgentHostPort: jaeger:6831