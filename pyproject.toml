[project]
name = "password-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    # Pin bcrypt until passlib supports the latest
    "bcrypt==4.0.1",
    "cryptography>=45.0.7",
    "emails>=0.6",
    "fastapi[standard]>=0.116.1",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10.1",
    "pyotp>=2.9.0",
    "pytest>=8.4.2",
    "python-jose>=3.5.0",
    "qrcode[pil]>=8.2",
    "ruff>=0.13.0",
    "sqlmodel>=0.0.24",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.ruff]
lint.per-file-ignores = { "alembic/env.py" = ["F401"] }
exclude = ["versions"]
