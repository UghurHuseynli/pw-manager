services:
  db:
    image: postgres:16-alpine
    container_name: pw-manager-db
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: prod
    container_name: pw-manager-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      POSTGRES_SERVER: db
      ENVIRONMENT: prod
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db-data:
