services:
  db:
    image: postgres:16-alpine
    container_name: pw-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: prod
    container_name: pw-manager-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Compose network DNS name of the db service above, overriding
      # whatever POSTGRES_SERVER is set to in .env (which can stay
      # "localhost" for running the app outside Docker).
      POSTGRES_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db-data:
